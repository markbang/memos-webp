name: Build and Publish WebP Image

# 手动触发：Actions -> Build and Publish WebP Image -> Run workflow
# （默认 tag 为 0.30.0-webp，与 docker-compose.yml 的默认镜像一致）
# 或推送形如 v0.30.0-webp 的 tag 自动触发。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（例如 0.30.0-webp）"
        required: true
        default: "0.30.0-webp"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # memos 后端 Dockerfile 依赖构建好的前端（server/router/frontend/dist）
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: 11.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: "web/pnpm-lock.yaml"
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm release
        working-directory: web

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/markbang/memos-webp:${{ steps.tag.outputs.value }}
          build-args: |
            VERSION=${{ steps.tag.outputs.value }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=build-webp
          cache-to: type=gha,mode=max,scope=build-webp
          # 关闭 SLSA attestation：它会在 manifest 里产生多余 unknown/unknown 条目
          provenance: false

      - name: Inspect published image
        run: docker buildx imagetools inspect ghcr.io/markbang/memos-webp:${{ steps.tag.outputs.value }}
